# GOOPHER CI/CD (Requirement T17): test -> eval -> build -> deploy to Cloud Run.
#
# Two jobs:
#   1) test  — always runs: unit tests (T9) + evals (T8). Fast, no cloud needed.
#   2) deploy — runs on push to main IF the GCP secrets are configured. Builds the
#               Docker image (T16) and deploys to Cloud Run (free tier, T14).
#
# Required repository secrets for deploy (Settings → Secrets and variables →
# Actions → New repository secret):
#   GCP_PROJECT_ID   your Google Cloud project id (e.g. sanika-project-2107)
#   GCP_SA_KEY       JSON key of a deployer service account (see README/scripts)
#   JWT_SECRET       a long random string for signing auth tokens
#   MASTER_PASSWORD  the ONLY password that can log in (single-user lockdown).
#                    If unset, the deployed service rejects every login.
# Optional:
#   ALLOWED_EMAILS   comma-separated allowlist (defaults to demo@goopher.app)
#   GOOGLE_API_KEY   AI Studio Gemini key (NOT needed when using Vertex AI, which
#                    this workflow does via USE_VERTEXAI=true)
#   OPENAI_API_KEY   only if you also want the OpenAI fallback available in cloud
#
# If GCP_SA_KEY / GCP_PROJECT_ID are absent (e.g. on a fork), the deploy job is
# skipped and CI still passes on the test job.

name: goopher-cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (minimal — tests run offline)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests (T9)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          LLM_PROVIDER: "none"
        run: pytest -q

      - name: Run evals (T8)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          LLM_PROVIDER: "none"
        run: python evals/run_evals.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SERVICE: goopher-api
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Check for GCP credentials
        id: gate
        env:
          # Pass secrets through env (handles the multi-line SA-key JSON safely).
          # Inlining ${{ secrets.GCP_SA_KEY }} directly in bash breaks the `if`
          # because the JSON spans multiple lines -> the gate always read "empty".
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJ: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$SA_KEY" ] && [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP secrets not set — skipping deploy."
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & push image (Cloud Build)
        if: steps.gate.outputs.ready == 'true'
        run: |
          # The deployer SA is granted roles/viewer (see scripts/setup_cicd.sh)
          # so it can stream the default-bucket build logs; otherwise
          # `gcloud builds submit` exits 1 even on a successful build.
          gcloud builds submit --quiet \
            --tag "gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}"

      - name: Deploy to Cloud Run (free tier)
        if: steps.gate.outputs.ready == 'true'
        env:
          # Only inject SAFE, known-shape secrets. We deliberately DO NOT pass
          # GOOGLE_API_KEY or OPENAI_API_KEY: the cloud service uses Vertex AI
          # (authenticated by the service account, USE_VERTEXAI=true) and Gemini,
          # so neither key is needed — and injecting them risks a malformed/
          # multi-line value breaking the env-var parser.
          PROJ: ${{ secrets.GCP_PROJECT_ID }}
          JWT: ${{ secrets.JWT_SECRET }}
          MASTER_PW: ${{ secrets.MASTER_PASSWORD }}
          ALLOWED: ${{ secrets.ALLOWED_EMAILS }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Sanitize: single tokens / single lines (env-var string can't contain
          # commas or newlines). The master password must NOT contain a comma.
          PROJ_CLEAN="$(printf '%s' "$PROJ" | tr -d '[:space:]')"
          JWT_CLEAN="$(printf '%s' "$JWT" | tr -d '\r\n')"
          PW_CLEAN="$(printf '%s' "$MASTER_PW" | tr -d '\r\n')"
          EMAILS_CLEAN="$(printf '%s' "${ALLOWED:-demo@goopher.app}" | tr -d '[:space:]')"
          RESEND_CLEAN="$(printf '%s' "$RESEND" | tr -d '[:space:]')"
          # Write env vars to a YAML file so the (possibly punctuation-heavy)
          # master password can't break gcloud's comma-separated --set-env-vars.
          F=/tmp/envvars.yaml
          : > "$F"
          echo "ENVIRONMENT: \"production\""               >> "$F"
          echo "DB_BACKEND: \"firestore\""                 >> "$F"
          echo "GOOGLE_CLOUD_PROJECT: \"${PROJ_CLEAN}\""   >> "$F"
          echo "OTEL_EXPORTER: \"gcp\""                    >> "$F"
          echo "LLM_PROVIDER: \"gemini\""                  >> "$F"
          echo "USE_ADK_PATH: \"true\""                    >> "$F"
          echo "USE_VERTEXAI: \"true\""                    >> "$F"
          echo "VERTEX_LOCATION: \"us-central1\""          >> "$F"
          echo "GEMINI_MODEL: \"gemini-2.5-flash\""        >> "$F"
          echo "JWT_SECRET: \"${JWT_CLEAN}\""              >> "$F"
          echo "ALLOWED_EMAILS: \"${EMAILS_CLEAN}\""       >> "$F"
          echo "MASTER_PASSWORD: \"${PW_CLEAN}\""          >> "$F"
          # Order-confirmation email via Resend (free tier). The test sender
          # onboarding@resend.dev needs no domain verification but only delivers
          # to the Resend account's own email — keep NOTIFY_EMAIL = that address.
          # If RESEND_API_KEY secret is unset, this is "" → email stays simulated.
          echo "NOTIFY_EMAIL: \"tungaresanika2@gmail.com\"" >> "$F"
          echo "EMAIL_FROM: \"onboarding@resend.dev\""      >> "$F"
          echo "RESEND_API_KEY: \"${RESEND_CLEAN}\""        >> "$F"
          gcloud run deploy "$SERVICE" \
            --image "gcr.io/${PROJ_CLEAN}/$SERVICE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 20 \
            --concurrency 80 \
            --memory 1Gi \
            --cpu 1 \
            --env-vars-file "$F"

      - name: Allow public access (run.invoker for allUsers)
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region "$REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" || \
            echo "::warning::Could not add allUsers invoker (org policy?). Service may require auth."

      - name: Show service URL
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Deployed: $URL"
          echo "### 🚀 GOOPHER deployed: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
