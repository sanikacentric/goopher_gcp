<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOOPHER</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="gp-header">
      <div class="gp-brand">
        <span class="gp-logo">🛍️</span>
        <div>
          <div class="gp-title">GOOPHER</div>
          <div class="gp-subtitle">Your shopping agent</div>
        </div>
      </div>
      <div class="gp-header-actions">
        <!-- Mute / unmute GOOPHER's spoken answers (also stops any speech now). -->
        <button id="muteBtn" class="gp-cart-btn gp-mute-btn" title="Mute voice" hidden>🔊</button>
        <!-- Cart / orders: click to see what's already been ordered. -->
        <button id="cartBtn" class="gp-cart-btn" title="View your orders" hidden>
          🛒<span id="cartCount" class="gp-cart-badge" hidden>0</span>
        </button>
        <button id="logoutBtn" class="gp-link" hidden>Sign out</button>
      </div>
    </header>

    <!-- ORDERS / CART PANEL (toggled by the cart button) -->
    <section id="ordersPanel" class="gp-orders-panel" hidden>
      <div class="gp-orders-head">
        <span>🛒 Your orders</span>
        <button id="ordersClose" class="gp-link" title="Close">✕</button>
      </div>
      <div id="ordersList" class="gp-orders-list"></div>
    </section>

    <!-- LOGIN VIEW (Requirement T1: authenticate the customer) -->
    <section id="loginView" class="gp-login">
      <h2>Sign in</h2>
      <p class="gp-hint">Demo: <code>demo@goopher.app</code> / <code>demo</code></p>
      <input id="email" type="email" placeholder="Email" value="demo@goopher.app" />
      <input id="password" type="password" placeholder="Password" value="demo" />
      <button id="loginBtn" class="gp-primary">Sign in</button>
      <div id="loginError" class="gp-error" hidden></div>
    </section>

    <!-- CHAT VIEW (shown only after sign-in) -->
    <section id="chatView" class="gp-chat" hidden>
      <div class="gp-controls">
        <label>Channel
          <select id="channel">
            <option value="web">Web</option>
            <option value="phone">Phone (voice)</option>
          </select>
        </label>
        <label>Language
          <select id="language">
            <option value="">Auto</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="pt">Português</option>
            <option value="hi">हिन्दी</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <!-- Read every answer aloud with Google's text-to-speech voices. -->
        <label class="gp-speak-toggle" title="Read GOOPHER's answers aloud">
          🔊 Speak
          <input id="speakToggle" type="checkbox" checked />
        </label>
      </div>

      <!-- DEVICE FRAME — plain in Web mode; rendered as a phone simulator when
           the channel is "Phone (voice)". Same features either way. -->
      <div id="deviceFrame" class="gp-device">
        <!-- Mobile status bar + notch (shown only in phone mode) -->
        <div class="gp-device-statusbar">
          <span id="phoneClock">9:41</span>
          <span class="gp-device-notch"></span>
          <span class="gp-device-signal">📶 5G&nbsp; 🔋</span>
        </div>
        <div class="gp-device-screen">
          <div id="messages" class="gp-messages"></div>

          <div id="attachmentBar" class="gp-attachbar"></div>

          <form id="composer" class="gp-composer">
            <label class="gp-attach" title="Attach image or file (multi-modal)">
              📎
              <input id="fileInput" type="file" accept="image/*,.csv,.txt,.pdf" hidden multiple />
            </label>
            <input id="messageInput" type="text" placeholder="Ask about products or your orders…" autocomplete="off" />
            <!-- Camera (Vision subagent): show a toy/food item to the camera and ask
                 its price or say "place an order". -->
            <button type="button" id="camBtn" class="gp-mic" title="Show an item to the camera">📷</button>
            <!-- Voice input: click to dictate your question (speech-to-text) -->
            <button type="button" id="micBtn" class="gp-mic" title="Ask by voice">🎤</button>
            <!-- Shopping Advisor (explicit ReAct / PlanReActPlanner): get a
                 recommendation and watch the agent PLAN → ACT → REASON. -->
            <button type="button" id="adviseBtn" class="gp-mic" title="Ask the Shopping Advisor (ReAct) for a recommendation">🧠</button>
            <button type="submit" class="gp-primary">Send</button>
          </form>
        </div>
        <!-- Home indicator (shown only in phone mode) -->
        <div class="gp-device-home"></div>
      </div>
    </section>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
