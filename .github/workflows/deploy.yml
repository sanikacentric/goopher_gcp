# GOOPHER CI/CD (Requirement T17): test -> eval -> build -> deploy to Cloud Run.
#
# Two jobs:
#   1) test  — always runs: unit tests (T9) + evals (T8). Fast, no cloud needed.
#   2) deploy — runs on push to main IF the GCP secrets are configured. Builds the
#               Docker image (T16) and deploys to Cloud Run (free tier, T14).
#
# Required repository secrets for deploy (Settings → Secrets and variables →
# Actions → New repository secret):
#   GCP_PROJECT_ID   your Google Cloud project id (e.g. sanika-project-2107)
#   GCP_SA_KEY       JSON key of a deployer service account (see README/scripts)
#   JWT_SECRET       a long random string for signing auth tokens
# Optional:
#   GOOGLE_API_KEY   AI Studio Gemini key (NOT needed when using Vertex AI, which
#                    this workflow does via USE_VERTEXAI=true)
#   OPENAI_API_KEY   only if you also want the OpenAI fallback available in cloud
#
# If GCP_SA_KEY / GCP_PROJECT_ID are absent (e.g. on a fork), the deploy job is
# skipped and CI still passes on the test job.

name: goopher-cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (minimal — tests run offline)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests (T9)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          LLM_PROVIDER: "none"
        run: pytest -q

      - name: Run evals (T8)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          LLM_PROVIDER: "none"
        run: python evals/run_evals.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SERVICE: goopher-api
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Check for GCP credentials
        id: gate
        env:
          # Pass secrets through env (handles the multi-line SA-key JSON safely).
          # Inlining ${{ secrets.GCP_SA_KEY }} directly in bash breaks the `if`
          # because the JSON spans multiple lines -> the gate always read "empty".
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJ: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$SA_KEY" ] && [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP secrets not set — skipping deploy."
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & push image (Cloud Build)
        if: steps.gate.outputs.ready == 'true'
        run: |
          # The deployer SA is granted roles/viewer (see scripts/setup_cicd.sh)
          # so it can stream the default-bucket build logs; otherwise
          # `gcloud builds submit` exits 1 even on a successful build.
          gcloud builds submit --quiet \
            --tag "gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}"

      - name: Deploy to Cloud Run (free tier)
        if: steps.gate.outputs.ready == 'true'
        env:
          # Pass secrets through env so special characters (colons, commas) in a
          # value can't break gcloud's --set-env-vars dict parser. We then write
          # a YAML env-vars file, which is immune to that parsing entirely.
          PROJ: ${{ secrets.GCP_PROJECT_ID }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JWT: ${{ secrets.JWT_SECRET }}
        run: |
          # Build a YAML env-vars file (handles special chars safely). Each value
          # is quoted; we strip any stray surrounding spaces from the project id.
          PROJ_CLEAN="$(echo "$PROJ" | tr -d '[:space:]')"
          cat > /tmp/envvars.yaml <<EOF
          ENVIRONMENT: "production"
          DB_BACKEND: "firestore"
          GOOGLE_CLOUD_PROJECT: "${PROJ_CLEAN}"
          OTEL_EXPORTER: "gcp"
          LLM_PROVIDER: "gemini"
          USE_ADK_PATH: "true"
          USE_VERTEXAI: "true"
          USE_MCP_TOOLS: "true"
          VERTEX_LOCATION: "us-central1"
          GEMINI_MODEL: "gemini-2.5-flash"
          OPENAI_API_KEY: "${OPENAI_KEY}"
          GOOGLE_API_KEY: "${GOOGLE_KEY}"
          JWT_SECRET: "${JWT}"
          EOF
          gcloud run deploy "$SERVICE" \
            --image "gcr.io/${PROJ_CLEAN}/$SERVICE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 1Gi \
            --cpu 1 \
            --env-vars-file /tmp/envvars.yaml

      - name: Allow public access (run.invoker for allUsers)
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region "$REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" || \
            echo "::warning::Could not add allUsers invoker (org policy?). Service may require auth."

      - name: Show service URL
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Deployed: $URL"
          echo "### 🚀 GOOPHER deployed: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
