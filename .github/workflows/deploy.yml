# GOOPHER CI/CD (Requirement T17): test -> eval -> build -> deploy to Cloud Run.
#
# Two jobs:
#   1) test  — always runs: unit tests (T9) + evals (T8). Fast, no cloud needed.
#   2) deploy — runs on push to main IF the GCP secrets are configured. Builds the
#               Docker image (T16) and deploys to Cloud Run (free tier, T14).
#
# Required repository secrets for deploy:
#   GCP_PROJECT_ID            your Google Cloud project id
#   GCP_SA_KEY                JSON key of a deployer service account
#   GOOGLE_API_KEY            Gemini API key (free tier) — set as a Cloud Run env var
#
# If the secrets are absent (e.g. on a fork), the deploy job is skipped and CI
# still passes on the test job.

name: goopher-cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (T9)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
        run: pytest -q

      - name: Run evals (T8)
        env:
          DB_BACKEND: sqlite
          ENABLE_TRACING: "false"
        run: python evals/run_evals.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SERVICE: goopher-api
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Check for GCP credentials
        id: gate
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP secrets not set — skipping deploy."
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & push image (Cloud Build)
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud builds submit --tag "gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}"

      - name: Deploy to Cloud Run (free tier)
        if: steps.gate.outputs.ready == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "ENVIRONMENT=production,DB_BACKEND=firestore,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},OTEL_EXPORTER=gcp,GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }}"

      - name: Show service URL
        if: steps.gate.outputs.ready == 'true'
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
