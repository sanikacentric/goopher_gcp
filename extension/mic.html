<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOOPHER Voice</title>
    <style>
      body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f7f8; color: #1a1a1a; display: flex; flex-direction: column;
        align-items: center; justify-content: center; height: 100vh; gap: 14px; text-align: center;
        padding: 16px;
      }
      .dot {
        width: 64px; height: 64px; border-radius: 50%; background: #c8102e; color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 30px;
      }
      .dot.live { animation: pulse 1s infinite; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(200,16,46,.5);} 70% { box-shadow: 0 0 0 16px rgba(200,16,46,0);} 100% { box-shadow: 0 0 0 0 rgba(200,16,46,0);} }
      #status { font-size: 14px; color: #444; min-height: 20px; }
      #hint { font-size: 12px; color: #888; }
      button { margin-top: 4px; padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="dot" class="dot">🎤</div>
    <div id="status">Starting microphone…</div>
    <div id="hint">Speak your full question — it sends after a short pause, or click Done.</div>
    <button id="done" hidden>✓ Done</button>
    <button id="retry" hidden>Try again</button>
    <script src="mic.js"></script>
  </body>
</html>
