[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goopher"
version = "0.1.0"
description = "GOOPHER — unified conversational retail agent for JCPenney casual dresses."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Make `backend` importable and keep tests quiet & deterministic.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["backend"]
